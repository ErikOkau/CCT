name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Sheet parse & bot unit tests
        working-directory: services/discord-ocr-bot
        run: |
          npm ci
          npm run test:unit
          npm run test:sheet-parse
